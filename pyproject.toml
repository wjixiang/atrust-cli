[project]
name = "atrust-cli"
version = "0.1.0"
description = "Unofficial Python CLI for the Sangfor aTrust SDP client on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wjx" }]
keywords = ["sangfor", "atrust", "vpn", "sdp", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
atrust = "atrust_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atrust_cli"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
