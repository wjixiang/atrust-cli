server:
    interface: 127.0.0.1
    port: 53
    do-ip6: no
    username: ""
    chroot: ""
    directory: "/tmp"
    pidfile: ""
    use-syslog: no
    logfile: ""
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"
    hide-identity: yes
    hide-version: yes
    access-control: 127.0.0.0/8 allow
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-first: no
    forward-addr: 223.5.5.5@853#dns.alidns.com
    forward-addr: 223.6.6.6@853#dns.alidns.com
